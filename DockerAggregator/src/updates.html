<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EagleNET Firmware</title>
<style>body{font:18px system-ui;background:#0b1825;color:#e4edf5;max-width:720px;margin:5vh auto;padding:24px}label,input,button{display:block;margin:14px 0}input,button{font:inherit;padding:12px;max-width:100%;box-sizing:border-box}button{background:#218ce0;color:white;border:0;border-radius:8px}input[type=password]{width:100%}output{display:block;white-space:pre-wrap;margin:24px 0}</style>
<h1>EagleNET Firmware bereitstellen</h1><p>Eine signierte <strong>.eagleota</strong>-Datei hochladen. Das Display installiert sie erst nach Bestätigung am Gerät.</p>
<form id="upload"><label for="token">OTA-Administrator-Token (kein Panel- oder PRTG-Token)</label><input id="token" type="password" autocomplete="off" required><label for="file">Firmware-Paket</label><input id="file" type="file" accept=".eagleota" required><button>Prüfen und bereitstellen</button></form><output id="status" role="status"></output><p>Das Token wird nur für diesen Upload verwendet und nicht im Browser gespeichert.</p><script src="/updates.js" defer></script></html>
